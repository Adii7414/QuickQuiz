openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
  - name: applications
  - name: quizzes
  - name: sessions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/teacher/login:
    post:
      operationId: teacherLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Teacher session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { description: Invalid credentials }
  /auth/moderator/login:
    post:
      operationId: moderatorLogin
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Moderator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Signed out }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { description: Not authenticated }
  /applications:
    post:
      operationId: createTeacherApplication
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherApplicationInput"
      responses:
        "201":
          description: Pending application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationReceipt"
    get:
      operationId: listTeacherApplications
      tags: [applications]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherApplication" }
        "403": { description: Moderator access required }
  /applications/{id}:
    get:
      operationId: getTeacherApplication
      tags: [applications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherApplication"
        "403": { description: Moderator access required }
  /application-status/{id}:
    get:
      operationId: getApplicationStatus
      tags: [applications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Safe public application status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatus"
        "404": { description: Application not found }
  /applications/{id}/decision:
    post:
      operationId: decideTeacherApplication
      tags: [applications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationDecisionInput"
      responses:
        "200":
          description: Moderation decision and one-time key when approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResult"
        "403": { description: Moderator access required }
  /teacher-registration:
    post:
      operationId: registerTeacher
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherRegistrationInput"
      responses:
        "201":
          description: Teacher session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400": { description: Invalid or expired registration key }
  /teachers:
    get:
      operationId: listTeachers
      tags: [applications]
      responses:
        "200":
          description: Teacher account summary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherSummary" }
        "403": { description: Moderator access required }
  /teachers/{id}/status:
    post:
      operationId: updateTeacherStatus
      tags: [applications]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherStatusInput"
      responses:
        "200":
          description: Updated teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSummary"
  /registration-keys/{applicationId}:
    get:
      operationId: getRegistrationKey
      tags: [applications]
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Registration key for an approved teacher application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationKeyDetails"
        "403": { description: Moderator access required }
        "404": { description: Registration key not found }
  /moderator/sessions:
    get:
      operationId: listModeratorSessions
      tags: [moderation]
      responses:
        "200":
          description: Active quiz rooms visible to moderators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationSession" }
        "403": { description: Moderator access required }
  /moderator/sessions/{code}/action:
    post:
      operationId: moderateQuizSession
      tags: [moderation]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationActionInput"
      responses:
        "200":
          description: Updated moderated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationSession"
        "400": { description: Invalid moderation action }
        "403": { description: Teacher owner or moderator access required }
        "404": { description: Session or participant not found }
  /moderator/users:
    get:
      operationId: listModeratorUsers
      tags: [moderation]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
      responses:
        "200":
          description: Searchable account directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationUser" }
        "403": { description: Moderator access required }
  /moderator/users/{id}/status:
    post:
      operationId: updateModeratorUserStatus
      tags: [moderation]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationUserStatusInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationUser"
        "400": { description: Invalid account status }
        "403": { description: Moderator access required }
        "404": { description: Account not found }
  /quizzes:
    get:
      operationId: listQuizzes
      tags: [quizzes]
      responses:
        "200":
          description: Teacher quizzes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quiz" }
    post:
      operationId: createQuiz
      tags: [quizzes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "201":
          description: Created quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
  /teacher/stats:
    get:
      operationId: getTeacherStats
      tags: [quizzes]
      responses:
        "200":
          description: Teacher dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherStats"
        "403": { description: Teacher access required }
  /quizzes/{id}:
    patch:
      operationId: updateQuiz
      tags: [quizzes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Updated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quiz"
    delete:
      operationId: deleteQuiz
      tags: [quizzes]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /question-banks:
    get:
      operationId: listQuestionBanks
      tags: [question-banks]
      responses:
        "200":
          description: Teacher question banks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuestionBank" }
        "403": { description: Teacher access required }
    post:
      operationId: createQuestionBank
      tags: [question-banks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankInput"
      responses:
        "201":
          description: Created question bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBank"
  /question-banks/{id}:
    patch:
      operationId: updateQuestionBank
      tags: [question-banks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankInput"
      responses:
        "200":
          description: Updated question bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBank"
    delete:
      operationId: deleteQuestionBank
      tags: [question-banks]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /quizzes/{id}/host:
    post:
      operationId: hostQuiz
      tags: [sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Hosted session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
  /sessions/{code}:
    get:
      operationId: getQuizSession
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Session lobby or quiz state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
    post:
      operationId: joinQuizSession
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinSessionInput"
      responses:
        "201":
          description: Student joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
  /sessions/{code}/start:
    post:
      operationId: startQuizSession
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
  /sessions/{code}/advance:
    post:
      operationId: advanceQuizSession
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Advanced or completed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
  /sessions/{code}/answers:
    post:
      operationId: submitAnswer
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Updated participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
  /sessions/{code}/results:
    get:
      operationId: getQuizSessionResults
      tags: [sessions]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Teacher-only detailed quiz results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResults"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TeacherStats:
      type: object
      required: [roomsHosted]
      properties:
        roomsHosted: { type: number }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
    CurrentUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [STUDENT, TEACHER, MODERATOR] }
    Session:
      allOf:
        - $ref: "#/components/schemas/CurrentUser"
    TeacherApplicationInput:
      type: object
      required: [fullName, email, organization, reason]
      properties:
        fullName: { type: string, minLength: 2 }
        email: { type: string }
        organization: { type: string, minLength: 2 }
        reason: { type: string, minLength: 10 }
        phone: { type: string }
        role: { type: string }
    ApplicationReceipt:
      type: object
      required: [id, status, submittedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING] }
        submittedAt: { type: string }
    ApplicationStatus:
      type: object
      required: [id, status, submittedAt, reviewedAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        submittedAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
    Announcement:
      type: object
      required: [id, message, createdAt]
      properties:
        id: { type: string }
        message: { type: string }
        createdAt: { type: string }
    TeacherApplication:
      allOf:
        - $ref: "#/components/schemas/TeacherApplicationInput"
        - type: object
          required: [id, status, submittedAt]
          properties:
            id: { type: string }
            status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
            submittedAt: { type: string }
            reviewedAt: { type: ["string", "null"] }
    ApplicationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
    DecisionResult:
      type: object
      required: [application]
      properties:
        application: { $ref: "#/components/schemas/TeacherApplication" }
        registrationKey: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
    TeacherRegistrationInput:
      type: object
      required: [registrationKey, name, email, password, passwordConfirmation]
      properties:
        registrationKey: { type: string, minLength: 16 }
        name: { type: string, minLength: 2 }
        email: { type: string }
        password: { type: string, minLength: 8 }
        passwordConfirmation: { type: string, minLength: 8 }
    TeacherSummary:
      type: object
      required: [id, name, email, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        organization: { type: string }
    TeacherStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    RegistrationKeyDetails:
      type: object
      required: [registrationKey, expiresAt, usedAt]
      properties:
        registrationKey: { type: string }
        expiresAt: { type: string }
        usedAt: { type: ["string", "null"] }
    ModerationSessionParticipant:
      type: object
      required: [id, name, answered, score, percentage]
      properties:
        id: { type: string }
        name: { type: string }
        answered: { type: number }
        score: { type: number }
        percentage: { type: number }
        locked: { type: boolean }
        muted: { type: boolean }
    ModerationSession:
      type: object
      required: [code, quizTitle, teacherName, teacherEmail, status, participantCount, currentQuestion, questionCount, createdAt, joinFrozen, announcements, liveQuestion, questionStats, participants]
      properties:
        code: { type: string }
        quizTitle: { type: string }
        teacherName: { type: string }
        teacherEmail: { type: string }
        status: { type: string, enum: [LOBBY, LIVE, PAUSED, COMPLETE] }
        participantCount: { type: number }
        currentQuestion: { type: number }
        questionCount: { type: number }
        createdAt: { type: string }
        joinFrozen: { type: boolean }
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        liveQuestion:
          type: object
          nullable: true
          required: [index, prompt, answers, correctIndex]
          properties:
            index: { type: number }
            prompt: { type: string }
            answers:
              type: array
              items: { type: string }
            correctIndex: { type: number }
        questionStats:
          type: array
          items:
            type: object
            required: [answered, correct]
            properties:
              answered: { type: number }
              correct: { type: number }
              accuracy: { type: number }
              answerCounts:
                type: array
                items: { type: number }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ModerationSessionParticipant" }
    ModerationActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [END, PAUSE, RESUME, FREEZE_JOINS, UNFREEZE_JOINS, REMOVE_PARTICIPANT, LOCK_PARTICIPANT, UNLOCK_PARTICIPANT, MUTE_PARTICIPANT, UNMUTE_PARTICIPANT, BAN_PARTICIPANT, SEND_ANNOUNCEMENT, SKIP_QUESTION, RESTART_QUESTION, EXTEND_TIME] }
        participantId: { type: string }
        message: { type: string, maxLength: 280 }
        seconds: { type: number, minimum: 5, maximum: 120 }
    ModerationUser:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [TEACHER, STUDENT, MODERATOR] }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string }
    ModerationUserStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
    QuizInput:
      type: object
      required: [title, description, questions]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        timeLimitSeconds: { type: number, minimum: 0, maximum: 600, description: "Optional per-question countdown. Zero disables the timer." }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionInput" }
    QuestionInput:
      type: object
      required: [prompt, answers, correctIndex]
      properties:
        prompt: { type: string, minLength: 2 }
        answers:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string, minLength: 1 }
        correctIndex: { type: number, minimum: 0, maximum: 3 }
    Quiz:
      allOf:
        - $ref: "#/components/schemas/QuizInput"
        - type: object
          required: [id, questionCount, updatedAt]
          properties:
            id: { type: string }
            questionCount: { type: number }
            updatedAt: { type: string }
    QuestionBankInput:
      type: object
      required: [name, description, questions]
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        questions:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/QuestionInput" }
    QuestionBank:
      allOf:
        - $ref: "#/components/schemas/QuestionBankInput"
        - type: object
          required: [id, questionCount, updatedAt]
          properties:
            id: { type: string }
            questionCount: { type: number }
            updatedAt: { type: string }
    QuizSession:
      type: object
      required: [code, status, quizTitle, participantCount, joinFrozen, participants]
      properties:
        code: { type: string }
        status: { type: string, enum: [LOBBY, LIVE, PAUSED, COMPLETE] }
        quizTitle: { type: string }
        participantCount: { type: number }
        joinFrozen: { type: boolean }
        announcements:
          type: array
          items: { $ref: "#/components/schemas/Announcement" }
        currentQuestion: { type: number }
        questionStartedAt: { type: string, format: date-time, nullable: true }
        questionStats:
          type: array
          items:
            type: object
            required: [answered, correct]
            properties:
              answered: { type: number }
              correct: { type: number }
              accuracy: { type: number }
              answerCounts:
                type: array
                items: { type: number }
        participants:
          type: array
          items: { $ref: "#/components/schemas/Participant" }
        quiz:
          $ref: "#/components/schemas/Quiz"
    JoinSessionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    Participant:
      type: object
      required: [id, name, answered, score]
      properties:
        id: { type: string }
        name: { type: string }
        answered: { type: number }
        score: { type: number }
        percentage: { type: number }
        locked: { type: boolean }
        muted: { type: boolean }
    AnswerInput:
      type: object
      required: [participantId, questionIndex, answerIndex]
      properties:
        participantId: { type: string }
        questionIndex: { type: number, minimum: 0 }
        answerIndex: { type: number, minimum: 0, maximum: 3 }
    QuizResults:
      type: object
      required: [code, quizTitle, questions, participants, totalParticipants, completedParticipants, averagePercentage, highestPercentage, lowestPercentage, totalAnswers, correctAnswers]
      properties:
        code: { type: string }
        quizTitle: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [index, prompt, answers, correctIndex]
            properties:
              index: { type: number }
              prompt: { type: string }
              answers:
                type: array
                items: { type: string }
              correctIndex: { type: number }
        participants:
          type: array
          items:
            type: object
            required: [id, name, score, percentage, answers]
            properties:
              id: { type: string }
              name: { type: string }
              score: { type: number }
              percentage: { type: number }
              answers:
                type: array
                items:
                  type: number
                  nullable: true
        questionStats:
          type: array
          items:
            type: object
            required: [answered, correct]
            properties:
              answered: { type: number }
              correct: { type: number }
              accuracy: { type: number }
              answerCounts:
                type: array
                items: { type: number }
        totalParticipants: { type: number }
        completedParticipants: { type: number }
        averagePercentage: { type: number }
        highestPercentage: { type: number }
        lowestPercentage: { type: number }
        totalAnswers: { type: number }
        correctAnswers: { type: number }
        medianPercentage: { type: number }
        scoreDistribution:
          type: array
          items:
            type: object
            required: [label, count]
