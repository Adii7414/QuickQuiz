kind = "web"
previewPath = "/"
title = "Quiz Platform"
description = "A secure live quiz platform where students join hosted quizzes, teachers run approved sessions, and moderators manage access."
version = "1.0.0"
id = "artifacts/quiz-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18645

[services.development]
run = "pnpm --filter @workspace/quiz-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quiz-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/quiz-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18645"
BASE_PATH = "/"
